<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7eff1" />
    <title>RepSight</title>
    <script>
      // Set the theme before first paint so there is no white/black flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="side-top">
          <div class="brand"><span class="brand-full">Rep<span>Sight</span><small>Axon (NVIDIA Nemotron) on Nebius</small></span><span class="brand-mini">R<span>S</span></span></div>
          <button id="collapse" class="collapse-btn" type="button" aria-label="Collapse sidebar" aria-pressed="false" title="Collapse sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        </div>
        <nav id="nav" aria-label="Sections"></nav>
        <div class="whoami"><span id="who"></span><button id="logout" class="link" type="button">Log out</button></div>
        <button id="theme" class="theme-btn" type="button" aria-label="Switch theme"></button>
      </aside>
      <div class="content">
        <main>
          <section id="log"></section>
          <section id="form"></section>
          <section id="coach"></section>
          <section id="dash"></section>
          <section id="photos"></section>
        </main>
      </div>
    </div>
    <div id="auth" class="auth-overlay" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
